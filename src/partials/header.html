<header class="site-header" data-header>
  <div class="site-header__bg" aria-hidden="true"></div>
  <div class="hdr-main">
    <div class="hdr-main__inner container">
      <button class="icon-btn hdr-burger" type="button" data-open="menu-drawer" aria-controls="menu-drawer" aria-haspopup="dialog">
        <svg class="i i--lg" aria-hidden="true"><use href="#i-list"></use></svg><span class="sr-only">Meniu</span>
      </button>
      <a class="logo" href="index.html"><img src="assets/img/brand/logo.svg" alt="RunMoto, pagrindinis puslapis" width="484" height="88"></a>
      <form class="search-field" role="search" action="index.html" method="get" data-search-form>
        <label class="sr-only" for="hdr-q">Paieška</label>
        <svg class="i search-field__icon" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg>
        <input class="search-field__input" id="hdr-q" name="q" type="search" placeholder="Dalis, modelis arba OEM kodas" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-panel" aria-autocomplete="list" enterkeyhint="search" data-search-input>
        <span class="search-field__hint" aria-hidden="true" data-search-hint><svg class="i"><use href="#i-motorcycle"></use></svg><span data-search-hint-text>Visos dalys</span></span>
      </form>
      <button class="garage-btn" type="button" data-open-garage aria-haspopup="dialog" data-garage-btn>
        <span class="garage-btn__icon"><svg class="i" aria-hidden="true"><use href="#i-garage"></use></svg></span>
        <span class="garage-btn__text"><span class="garage-btn__label">Mano garažas</span><span class="garage-btn__value" data-garage-label>Pasirinkite techniką</span></span>
      </button>
      <div class="hdr-actions">
        <a class="icon-btn hdr-only-desktop" href="#" data-demo="Paskyra: prisijungimas ir verslo paskyros registracija (demo)">
          <svg class="i i--lg" aria-hidden="true"><use href="#i-user"></use></svg><span class="sr-only">Paskyra</span>
        </a>
        <button class="icon-btn hdr-only-desktop" type="button" data-open="wish-drawer" aria-controls="wish-drawer" aria-haspopup="dialog">
          <svg class="i i--lg" aria-hidden="true"><use href="#i-heart"></use></svg><span class="sr-only">Norų sąrašas</span>
          <span class="count-badge" data-wish-count hidden>0</span>
        </button>
        <button class="cart-btn" type="button" data-open="cart-drawer" aria-controls="cart-drawer" aria-haspopup="dialog">
          <span class="cart-btn__icon"><svg class="i i--lg" aria-hidden="true"><use href="#i-shopping-cart-simple"></use></svg><span class="count-badge" data-cart-count hidden>0</span></span>
          <span class="cart-btn__sum" data-cart-sum>0 €</span><span class="sr-only">Krepšelis</span>
        </button>
      </div>
    </div>
  </div>
  <div class="hdr-sub">
    <nav class="hdr-nav container" aria-label="Pagrindinė navigacija">
      <button class="hdr-nav__all" type="button" aria-expanded="false" aria-controls="mega" data-mega-toggle>
        <svg class="i" aria-hidden="true"><use href="#i-squares-four"></use></svg>Visos kategorijos
      </button>
      <a class="hdr-nav__link" href="#kategorijos" data-mega-open="moto">Motorolerių dalys</a>
      <a class="hdr-nav__link" href="#kategorijos" data-mega-open="moto">Motociklų dalys</a>
      <a class="hdr-nav__link hdr-nav__link--used" href="#naudotos"><svg class="i" aria-hidden="true"><use href="#i-recycle"></use></svg>Naudotos dalys</a>
      <a class="hdr-nav__link hdr-nav__link--hide-md" href="#kategorijos">Ekipiruotė</a>
      <a class="hdr-nav__link hdr-nav__link--hide-lg" href="#kategorijos">Alyvos ir chemija</a>
      <a class="hdr-nav__link hdr-nav__link--sale" href="#akcijos">Akcijos %</a>
      <span class="hdr-nav__spacer"></span>
      <a class="hdr-nav__b2b" href="#verslui"><svg class="i" aria-hidden="true"><use href="#i-briefcase"></use></svg><span class="hdr-nav__b2b-long">Servisams ir verslui</span><span class="hdr-nav__b2b-short">Verslui</span></a>
    </nav>
    <div class="hdr-mgarage container">
      <button class="search-btn-m" type="button" data-open-search aria-controls="search-panel">
        <svg class="i" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg><span>Dalis arba OEM kodas</span>
      </button>
      <button class="garage-btn" type="button" data-open-garage aria-haspopup="dialog" data-garage-btn>
        <span class="garage-btn__icon"><svg class="i" aria-hidden="true"><use href="#i-garage"></use></svg></span>
        <span class="garage-btn__text"><span class="garage-btn__label">Garažas</span><span class="garage-btn__value" data-garage-label>Pasirinkite</span></span>
      </button>
    </div>
    <div class="mega" id="mega" data-mega data-lenis-prevent></div>
  </div>
  <div class="hdr-scrim" data-header-scrim aria-hidden="true"></div>
  <div class="search-panel" id="search-panel" data-search-panel data-lenis-prevent>
    <div class="search-panel__bar">
      <form class="search-field" role="search" action="index.html" method="get" data-search-form>
        <label class="sr-only" for="search-q-m">Paieška</label>
        <svg class="i search-field__icon" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg>
        <input class="search-field__input" id="search-q-m" name="q" type="search" placeholder="Dalis, modelis arba OEM kodas" autocomplete="off" spellcheck="false" enterkeyhint="search" data-search-input>
      </form>
      <button class="search-panel__cancel" type="button" data-search-close>Atšaukti</button>
    </div>
    <div class="search-panel__inner container" data-search-results></div>
    <p class="sr-only" role="status" aria-live="polite" data-search-status></p>
  </div>
</header>
